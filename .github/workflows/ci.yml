name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential

      - name: Install JS deps
        run: npm ci

      - name: Testes do front (vitest)
        run: npm test

      # O `tsc` do build é quem impõe a paridade do i18n: `es`/`en` são
      # `Record<MessageKey, string>`, então chave faltando aqui é erro de compilação.
      - name: Frontend build
        run: npm run build

      - name: Rust testes (build padrão)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust testes (com rede p2p — iroh + double ratchet)
        working-directory: src-tauri
        run: cargo test --locked --features p2p
